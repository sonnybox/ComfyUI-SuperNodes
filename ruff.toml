line-length = 80
indent-width = 4
target-version = "py313"

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[lint]
select = ["E", "F", "I"]
ignore = ["E501", "F401", "F841"]

[lint.isort]
combine-as-imports = true
force-sort-within-sections = true
